    task makejar(type: Jar) {
        from file('build/intermediates/javac/debug/classes')
        archiveName = 'v8sdk' + defaultConfig.versionName + '.jar'
        destinationDir = file('build/libs')
        include "com/jstyle/blesdkv8/**"
        rename ('classes.jar', 'v8sdk' + defaultConfig.versionName + '.jar')
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    makejar.dependsOn(build)

